name: Android Compose

on:
  push:
    branches:
      - agent/android-compose-port
  pull_request:
    paths:
      - 'android-compose/**'
      - '.github/workflows/android-compose.yml'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Compose APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-compose :app:assembleDebug --stacktrace 2>&1 | tee compose-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compose-build-log
          path: compose-build.log
          if-no-files-found: warn

      - name: Upload Compose APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ykw-editors-compose-arm64
          path: android-compose/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
